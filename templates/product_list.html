{% extends 'base.html' %}
{% block content %}
<h2 class="text-center mb-4">Product List</h2>
<div class="row">
    {% for product in products %}
    <div class="col-md-3 mb-4">
        <div class="card h-100 shadow-sm text-center p-2">
            {% if product.product_image %}
                <img src="{{ product.product_image.url }}" class="card-img-top mx-auto" style="height: 150px; object-fit: contain;">
            {% endif %}
            <div class="card-body p-2">
                <h6 class="card-title fw-bold mt-2">{{ product.product_name }}</h6>
                <p class="card-text text-teal fw-bold text-success">৳{{ product.product_price }}</p>
                <div class="d-flex justify-content-center gap-1">
                    <a href="{% url 'edit_product' product.id %}" class="btn btn-success btn-sm px-2">Edit</a>
                    <a href="{% url 'product_detail' product.id %}" class="btn btn-info btn-sm text-white px-2">View</a>
                    <a href="{% url 'delete_product' product.id %}" class="btn btn-danger btn-sm px-2">Delete</a>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
        <p class="text-center">No products added yet.</p>
    {% endfor %}
</div>
{% endblock %}
