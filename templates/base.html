<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth & CRUD App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">MyApp</a>
        <div class="navbar-nav ms-auto">
          {% if user.is_authenticated %}
            <a class="nav-link" href="{% url 'home' %}">Home Page</a>
            <a class="nav-link" href="{% url 'product_list' %}">Product List</a>
            <a class="nav-link" href="{% url 'add_product' %}">Add Product</a>
            <a class="nav-link text-danger" href="{% url 'logout' %}">Logout</a>
          {% else %}
            <a class="nav-link" href="{% url 'signup' %}">Signup</a>
            <a class="nav-link" href="{% url 'login' %}">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
