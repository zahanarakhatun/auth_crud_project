{% extends 'base.html' %}
{% block content %}
<div class="card col-md-6 mx-auto mt-4 p-3 text-center">
    <h2>User Profile</h2>
    {% if user.profile_image %}
        <img src="{{ user.profile_image.url }}" class="rounded-circle mx-auto my-3" style="width:150px; height:150px; object-fit:cover;">
    {% endif %}
    <h4><strong>Full Name:</strong> {{ user.full_name }}</h4>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>User Type:</strong> {{ user.user_types }}</p>
    <p><strong>Date of Birth:</strong> {{ user.date_of_birth }}</p>
</div>
{% endblock %}
